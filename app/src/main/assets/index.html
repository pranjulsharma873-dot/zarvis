<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zarvis AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #212121;
    color: white;
    height: 100vh;
}

.app {
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 260px;
    background: #171717;
    padding: 15px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    cursor: pointer;
}

.history {
    margin-top: 20px;
    color: #aaa;
}

.history p {
    padding: 10px;
}

/* CHAT */

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 60px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

/* MESSAGE */

.message {
    display: flex;
    max-width: 800px;
    margin: 0 auto 25px;
    gap: 12px;
}

.message.ai {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

/* AI TEXT */

.message.ai .text {
    background: #2f2f2f;
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 70%;
}

/* USER TEXT */

.message.user .text {
    background: #10a37f;
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 70%;
    order: 1;
}

/* AVATAR */

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* USER AVATAR RIGHT */

.message.user .avatar {
    order: 2;
}

/* INPUT */

.input-area {
    padding: 15px;
}

.input-box {
    max-width: 800px;
    margin: auto;
    background: #2f2f2f;
    border: 1px solid #555;
    border-radius: 15px;
    display: flex;
    align-items: center;
    padding: 8px;
}

.input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    padding: 12px;
}

.input-box button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #10a37f;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .messages {
        padding: 20px 10px;
    }

    .message {
        max-width: 100%;
    }

    .message .text {
        max-width: 80%;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="history">

            <p>Python Learning</p>
            <p>My AI Project</p>
            <p>Machine Learning</p>

        </div>

    </div>


    <!-- CHAT -->

    <div class="chat">

        <div class="topbar">
            Zarvis
        </div>


        <div class="messages" id="messages">

            <!-- AI MESSAGE -->

            <div class="message ai">

                <div class="avatar">
                    🤖
                </div>

                <div class="text">
                    Hello 👋<br>
                    Main tumhara AI assistant hoon.
                </div>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <input
                    type="text"
                    id="input"
                    placeholder="Message Zarvis..."
                    onkeydown="handleEnter(event)"
                >

                <button onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </div>

</div>

<script>

// =====================================================
// ZARVIS AI BRAIN (converted from app.py to JavaScript)
// Runs fully offline inside the WebView — no server needed
// =====================================================

const STORAGE_KEY = "zarvis_memory";

// Preloaded from the original memory.json
const DEFAULT_MEMORY = {
    "mai kon hu": { "answer": "pranjul", "learned_at": "2026-09-06 15:33:42" },
    "tum kon ko": { "answer": "tum zarvis", "learned_at": "2026-09-06 15:34:10" }
};

function loadMemory() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            return JSON.parse(raw);
        }
    } catch (e) {
        console.log("memory load error", e);
    }
    // first run: seed with default memory
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_MEMORY));
    return JSON.parse(JSON.stringify(DEFAULT_MEMORY));
}

function saveMemory(memory) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(memory));
    } catch (e) {
        console.log("memory save error", e);
    }
}

let answers = loadMemory();

function cleanMessage(message) {
    message = message.toLowerCase().trim();
    message = message.replace(/[^\w\s]/g, "");
    message = message.split(/\s+/).filter(Boolean).join(" ");
    return message;
}

function aiReply(rawMessage) {
    const message = cleanMessage(rawMessage);

    if (message === "") {
        return { known: true, reply: "Kuch likho bhai 😄" };
    }

    // MEMORY
    if (Object.prototype.hasOwnProperty.call(answers, message)) {
        const saved = answers[message];
        const text = (typeof saved === "object" && saved !== null) ? saved.answer : saved;
        return { known: true, reply: text };
    }

    // BASIC KNOWLEDGE
    if (["hello", "hlo", "hi"].includes(message)) {
        return { known: true, reply: "Hello bhai! 👋 Main Zarvis hoon." };
    }

    if (message === "tumhara naam kya hai") {
        return { known: true, reply: "Mera naam Zarvis hai. 🤖" };
    }

    if (message === "who are you") {
        return { known: true, reply: "Main tumhara AI assistant Zarvis hoon." };
    }

    // UNKNOWN
    return { known: false, reply: "Mujhe iska answer abhi nahi pata 😕" };
}

function teachAnswer(question, newAnswer) {
    question = question.trim();
    newAnswer = newAnswer.trim();

    if (question === "" || newAnswer === "") {
        return { success: false, reply: "Question aur answer dono chahiye." };
    }

    const cleanedQuestion = cleanMessage(question);

    answers[cleanedQuestion] = {
        answer: newAnswer,
        learned_at: new Date().toLocaleString()
    };

    saveMemory(answers);

    return { success: true, reply: "Thanks bhai! 🧠 Maine ye baat yaad kar li." };
}

// =====================================================
// UI LOGIC
// =====================================================

function handleEnter(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

function newChat() {
    document.getElementById("messages").innerHTML = `
        <div class="message ai">
            <div class="avatar">🤖</div>
            <div class="text">
                Hello 👋<br>
                Main tumhara AI assistant hoon.
            </div>
        </div>
    `;
}

function sendMessage() {

    let input = document.getElementById("input");
    let message = input.value.trim();

    if (message === "") {
        return;
    }

    let messages = document.getElementById("messages");

    // USER MESSAGE
    messages.innerHTML += `
        <div class="message user">
            <div class="text">
                ${message}
            </div>
            <div class="avatar">
                👤
            </div>
        </div>
    `;

    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    // AI REPLY (local, offline)
    const data = aiReply(message);

    messages.innerHTML += `
        <div class="message ai">
            <div class="avatar">
                🤖
            </div>
            <div class="text">
                ${data.reply}
                ${
                    data.known
                    ? ""
                    : `
                    <br><br>
                    <button
                        onclick="teachAI('${message.replace(/'/g, "\\'")}')"
                        style="
                            padding:8px 12px;
                            border:none;
                            border-radius:8px;
                            background:#10a37f;
                            color:white;
                            cursor:pointer;
                        "
                    >
                        🧠 Mujhe Sikhao
                    </button>
                    `
                }
            </div>
        </div>
    `;

    messages.scrollTop = messages.scrollHeight;
}

function teachAI(question) {

    let answer = prompt("Zarvis ko iska answer sikhao:");

    if (answer === null || answer.trim() === "") {
        return;
    }

    const data = teachAnswer(question, answer);

    let messages = document.getElementById("messages");

    messages.innerHTML += `
        <div class="message ai">
            <div class="avatar">
                🤖
            </div>
            <div class="text">
                ${data.reply}
            </div>
        </div>
    `;

    messages.scrollTop = messages.scrollHeight;
}

</script>
</body>
</html>
